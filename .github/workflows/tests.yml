name: QA Automation Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Download MetaMask extension
        run: npm run prepare:extensions
        env:
          METAMASK_VERSION: ${{ vars.METAMASK_VERSION }}

      - name: Restore Pocket Universe extension
        # Pocket Universe is closed-source and cannot be fetched publicly.
        # Provision it in CI from a private artifact/secret store, e.g.:
        #   - uses: actions/download-artifact@v4
        #     with:
        #       name: pocket-universe-extension
        #       path: extensions/pocket-universe
        # This step is left as a placeholder for that private provisioning step.
        run: |
          if [ ! -f extensions/pocket-universe/manifest.json ]; then
            echo "::warning::extensions/pocket-universe is not provisioned in this CI job. See extensions/pocket-universe/README.md"
          fi

      - name: Run tests
        run: npm test
        env:
          BASE_URL: ${{ vars.BASE_URL }}
          METAMASK_SEED_PHRASE: ${{ secrets.METAMASK_SEED_PHRASE }}
          METAMASK_PASSWORD: ${{ secrets.METAMASK_PASSWORD }}
          CI: true
          HEADLESS: true

      - name: Generate Allure report
        if: always()
        run: npm run report:generate

      - name: Upload Allure report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report
          retention-days: 20

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 20
